[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucisync"
version = "0.1.0"
description = "Synchronisation graphique de fichiers et de répertoires"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7"]

[project.scripts]
lucisync = "lucisync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
